<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Hunter</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏨</text></svg>">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#11141a">
  <script>try { if (localStorage.getItem('hh-theme') === '"light"') document.documentElement.dataset.theme = 'light'; } catch {}</script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <h1>🏨 Hotel Hunter</h1>
      <nav>
        <button class="tab active" data-tab="search">Search</button>
        <button class="tab" data-tab="watch">Watchlist <span id="watch-count" class="count"></span></button>
        <button id="theme" class="theme-toggle" type="button" aria-label="Switch to light mode" title="Switch light/dark">☀️</button>
      </nav>
    </div>
  </header>

  <div id="demo-banner" class="banner wrap" hidden>
    Demo mode: hotels, prices and reviews are made up. Remove <code>DEMO_MODE=true</code> for live prices.
  </div>

  <main class="wrap">
    <section id="tab-search">
      <form id="search-form" class="card search">
        <label class="grow">Destination
          <input id="q" name="q" placeholder="e.g. Scottsdale, AZ" required>
        </label>
        <label>Check-in <input id="checkIn" type="date" name="checkIn" required></label>
        <label>Check-out <input id="checkOut" type="date" name="checkOut" required></label>
        <label class="narrow">Adults <input id="adults" type="number" name="adults" min="1" max="10" value="2"></label>
        <label class="narrow">Kids <input id="children" type="number" name="children" min="0" max="10" value="0"></label>
        <button type="submit" class="primary">Search all sites</button>
      </form>

      <div id="filters" class="card filters" hidden>
        <div class="row">
          <span class="row-label">Highlight hotels with</span>
          <label class="chip"><input type="checkbox" id="w-pool" checked> 🏊 Pool</label>
          <label class="chip"><input type="checkbox" id="w-hottub" checked> ♨️ Hot tub</label>
          <label class="chip"><input type="checkbox" id="w-heated"> 🔥 Heated pool</label>
        </div>
        <div class="row">
          <span class="row-label">Distance from</span>
          <span id="origin-label" class="origin">city centre</span>
          <button type="button" id="origin-me" class="secondary small">📍 My location</button>
          <form id="origin-form" class="origin-form">
            <input id="origin-q" placeholder="City or address" aria-label="City or address to measure distance from">
            <button type="submit" class="secondary small">Set</button>
          </form>
          <select id="unit" aria-label="Distance unit"><option value="mi">mi</option><option value="km">km</option></select>
        </div>
        <div class="row">
          <label>Sort by
            <select id="f-sort">
              <option value="total">Total price</option>
              <option value="nightly">Price per night</option>
              <option value="distance">Distance</option>
              <option value="rating">Guest rating</option>
              <option value="value">Best value (rating ÷ price)</option>
            </select>
          </label>
          <label>Max distance
            <select id="f-dist"><option value="0">Any</option><option value="5">5</option><option value="10">10</option><option value="25">25</option><option value="50">50</option></select>
          </label>
          <label>Max / night <input type="number" id="f-max" min="0" placeholder="any"></label>
          <label>Min rating
            <select id="f-rating"><option value="0">Any</option><option value="3.5">3.5+</option><option value="4">4.0+</option><option value="4.5">4.5+</option></select>
          </label>
          <label>Min stars
            <select id="f-stars"><option value="0">Any</option><option value="2">2+</option><option value="3">3+</option><option value="4">4+</option><option value="5">5</option></select>
          </label>
          <button id="bulk-heat" type="button" class="secondary" title="Reads guest reviews of the top 10 hotels that have a pool or hot tub">Check pool heat for top 10</button>
        </div>
      </div>

      <p id="sources" class="muted small-text"></p>
      <p id="summary" class="muted"></p>
      <div id="results"></div>
    </section>

    <section id="tab-watch" hidden>
      <p class="muted">Watched stays are re-priced automatically every <span id="watch-interval">12</span> hours. The more history, the better the price forecast.</p>
      <div id="watchlist"></div>
    </section>
  </main>

  <template id="hotel-tpl">
    <article class="card hotel">
      <div class="thumb"></div>
      <div class="body">
        <div class="head">
          <div>
            <h3 class="name"></h3>
            <div class="meta"></div>
          </div>
          <div class="price">
            <div class="nightly"></div>
            <div class="total"></div>
            <div class="where"></div>
          </div>
        </div>
        <div class="ribbon" hidden></div>
        <div class="badges"></div>
        <div class="forecast"></div>
        <div class="actions">
          <button class="secondary act-prices">Compare all sites</button>
          <button class="secondary act-heat">Check pool heat</button>
          <button class="secondary act-watch">☆ Watch price</button>
        </div>
        <div class="panel panel-prices" hidden></div>
        <div class="panel panel-heat" hidden></div>
      </div>
    </article>
  </template>

  <script src="app.js" type="module"></script>
</body>
</html>
