# For a VPS: app + Caddy (automatic HTTPS). For TrueNAS use truenas/hotel-hunter.yaml instead.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - hotel-data:/data

  # Caddy serves your domain and gets/renews the HTTPS certificate automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  hotel-data:
  caddy-data:
  caddy-config:
